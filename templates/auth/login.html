{% extends "base.html" %}

{% block content %}
<style>
    body {
        background-color: #F8F9FA !important;
        background-image: radial-gradient(#4FBE37 1px, transparent 1px), radial-gradient(#ED1C24 1px, #F8F9FA 1px) !important;
        background-size: 40px 40px !important;
        background-position: 0 0, 20px 20px !important;
    }

    .navbar-custom {
        display: none !important;
    }
</style>

<div class="row align-items-center justify-content-evenly" style="min-height: 88vh;">
    <!-- Columna Izquierda: Cuadro de Acceso Segregado -->
    <div class="col-md-6 col-lg-5 mb-4">
        <div class="card p-5 card-cartoon-mario shadow-lg">
            <div class="text-center mb-4">
                <img src="{{ url_for('static', filename='img/DL.png') }}" alt="DL Tech Logo" class="img-fluid mb-3" style="max-height: 90px; filter: drop-shadow(3px 3px 0px #100F0D);">
                <h2 class="font-title fw-bold text-dark mb-1">Acceso al Panel</h2>
                <p class="text-muted small">Módulo de Telefonía y Accesorios DL Tech</p>
            </div>
            
            <form method="POST" action="/auth/login">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
                <div class="mb-3">
                    <label class="form-label font-title text-dark small">Correo Electrónico</label>
                    <input type="email" class="form-control form-control-lg border-2 border-dark bg-light font-body" name="email" required placeholder="tu@dltech.com">
                </div>
                
                <div class="mb-4">
                    <label class="form-label font-title text-dark small">Contraseña</label>
                    <input type="password" class="form-control form-control-lg border-2 border-dark bg-light font-body" name="password" required placeholder="••••••••">
                </div>
                
                <div class="d-grid">
                    <button type="submit" class="btn btn-mario btn-lg py-3">
                        <i class="fa-solid fa-gamepad me-2"></i> INGRESAR AL PANEL
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- Columna Derecha: Logo Central 3D -->
    <div class="col-md-6 col-lg-6 d-none d-md-flex justify-content-center align-items-center text-center">
        <img src="{{ url_for('static', filename='img/DL.png') }}" alt="Identidad Visual DL Tech" class="img-fluid" style="max-height: 420px; filter: drop-shadow(6px 6px 0px #100F0D);">
    </div>
</div>
{% endblock %}
